services:
  api:
    image: medic-api:1.0.0
    container_name: medic-api
    restart: always
    user: "${UID}:${GID}"

    working_dir: /app

    volumes:
    - ./services/api:/app
    - go-mod-cache:/go/pkg/mod
    ports:
      - "8081:8080"

    environment:
      TZ: Asia/Jakarta
      GOCACHE: /tmp/go-build

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - hospital-network

  auth:
    image: yayansty/php83-apache-sqlsrv:1.0.0
    container_name: auth
    restart: always

    ports:
      - "8080:80"

    volumes:
      - ./services/auth:/var/www/html
      - /etc/localtime:/etc/localtime:ro

    working_dir: /var/www/html

    environment:
      - TZ=Asia/Jakarta

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - hospital-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    restart: always

    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer

    ports:
      - "${SQLSERVER_PORT}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - hospital-network

volumes:
  sqlserver_data:
  go-mod-cache:

networks:
  hospital-network:
    driver: bridge
